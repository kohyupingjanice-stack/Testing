<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Search Portal</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Student Records</p>
          <h1>Student Search Portal</h1>
        </div>
        <div class="header-actions">
          <label class="upload-btn">
            <input id="excelFileInput" type="file" accept=".csv,.xlsx,.xls" />
            Upload Excel / CSV
          </label>
        </div>
      </header>

      <main class="content">
        <section class="panel controls-panel">
          <div class="control-group wide">
            <label for="searchInput">Search students</label>
            <input
              id="searchInput"
              type="text"
              placeholder="Search by name, ID, email, phone, program..."
            />
          </div>

          <div class="control-group">
            <label for="departmentFilter">Department</label>
            <select id="departmentFilter">
              <option value="all">All departments</option>
            </select>
          </div>

          <div class="control-group">
            <label for="yearFilter">Year</label>
            <select id="yearFilter">
              <option value="all">All years</option>
            </select>
          </div>

          <div class="control-group">
            <label for="statusFilter">Status</label>
            <select id="statusFilter">
              <option value="all">All statuses</option>
            </select>
          </div>
        </section>

        <section class="stats-row" id="statsRow">
          <div class="stat-card">
            <span>Total Students</span>
            <strong id="totalStudents">0</strong>
          </div>
          <div class="stat-card">
            <span>Visible Results</span>
            <strong id="visibleStudents">0</strong>
          </div>
          <div class="stat-card">
            <span>Departments</span>
            <strong id="departmentCount">0</strong>
          </div>
        </section>

        <section class="table-panel panel">
          <div class="table-header">
            <h2>Student List</h2>
            <span id="resultSummary">0 results</span>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Student ID</th>
                  <th>Name</th>
                  <th>Program</th>
                  <th>Department</th>
                  <th>Year</th>
                  <th>Email</th>
                  <th>Phone</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="studentTableBody"></tbody>
            </table>
          </div>

          <div id="emptyState" class="empty-state hidden">
            No students match your search. Try another keyword or upload a different Excel file.
          </div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
